[project]
name = "amber-procure"
version = "0.1.0"
description = "Procurement specialist agents for construction (Kaya AI Grand Challenge, Track 03)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8",
  "mcp>=2.3,<3",
  "pymupdf>=1.24",
  "pint>=0.24",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "rapidfuzz>=3.9",
  "openpyxl>=3.1",
  "anyio>=4",
  "starlette>=0.40",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
amber-mcp = "amber.server:main"
amber-web = "amber.web:main"

[tool.setuptools]
packages = ["amber"]

[tool.setuptools.package-data]
amber = ["web_index.html", "demo_shim.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
